<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI SRT Translator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 15h4M13 15h4M7 11h10"/></svg>
      </div>
      <div>
        <div class="brand-name" data-i18n="brand" dir="ltr"></div>
        <div class="brand-sub" data-i18n="brand_sub"></div>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item primary active" data-page="pipeline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <span data-i18n="nav_pipeline"></span>
      </button>
      <div class="nav-label" data-i18n="nav_manual"></div>
      <button class="nav-item" data-page="split">
        <span class="nav-num">1</span><span data-i18n="nav_split"></span>
      </button>
      <button class="nav-item" data-page="translate">
        <span class="nav-num">2</span><span data-i18n="nav_translate"></span>
      </button>
      <button class="nav-item" data-page="merge">
        <span class="nav-num">3</span><span data-i18n="nav_merge"></span>
      </button>
      <div class="nav-spacer"></div>
      <button class="nav-item" data-page="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span data-i18n="nav_settings"></span>
        <span class="dot warn hidden" id="key-dot"></span>
      </button>
      <button class="nav-item" data-page="help">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></svg>
        <span data-i18n="nav_help"></span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="seg" id="lang-switch">
        <button data-lang="he">עברית</button>
        <button data-lang="en">English</button>
      </div>
      <button class="icon-btn" id="theme-btn" title="Theme">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <!-- File card (shared by job pages) -->
    <section class="file-zone" id="file-zone">
      <div class="drop" id="drop">
        <div class="drop-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15l3-3 3 3"/></svg>
        </div>
        <div class="drop-text">
          <div class="drop-title" data-i18n="drop_title"></div>
          <div class="drop-sub" data-i18n="drop_sub"></div>
        </div>
        <div class="drop-actions">
          <button class="btn ghost" id="folder-btn" data-i18n="browse_folder"></button>
          <button class="btn ghost" id="browse-btn" data-i18n="browse"></button>
        </div>
      </div>

      <div class="file-card hidden" id="file-card">
        <div class="file-icon">SRT</div>
        <div class="file-meta">
          <div class="file-name" id="file-name" dir="auto"></div>
          <div class="file-path" id="file-path" dir="ltr"></div>
        </div>
        <div class="stats">
          <div class="stat"><div class="stat-v" id="stat-blocks">–</div><div class="stat-l" data-i18n="stat_blocks"></div></div>
          <div class="stat"><div class="stat-v" id="stat-duration" dir="ltr">–</div><div class="stat-l" data-i18n="stat_duration"></div></div>
          <div class="stat"><div class="stat-v" id="stat-parts">–</div><div class="stat-l" data-i18n="stat_parts"></div></div>
        </div>
        <button class="btn ghost sm" id="change-btn" data-i18n="change"></button>
      </div>

      <div class="queue hidden" id="queue">
        <div class="queue-head">
          <span id="queue-title"></span>
          <button class="link-btn" id="queue-add" data-i18n="queue_add"></button>
        </div>
        <div class="queue-list" id="queue-list"></div>
      </div>
    </section>

    <!-- ===== PIPELINE ===== -->
    <section class="page active" id="page-pipeline">
      <header class="page-head">
        <h1 data-i18n="pipe_title"></h1>
        <p data-i18n="pipe_desc"></p>
      </header>

      <div class="card run-card">
        <div class="field-inline">
          <label for="chunk" data-i18n="chunk"></label>
          <div class="stepper">
            <button data-step="-50">−</button>
            <input type="number" id="chunk" value="150" min="1" step="50" dir="ltr">
            <button data-step="50">+</button>
          </div>
          <span class="hint" data-i18n="chunk_hint"></span>
        </div>
        <button class="model-chip" id="model-chip" title="" dir="ltr"></button>
        <div class="run-actions">
          <button class="btn danger cancel-btn" data-i18n="cancel"></button>
          <button class="btn primary lg" id="run-pipeline">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <span data-i18n="run_pipeline"></span>
          </button>
        </div>
      </div>

      <div class="stages" id="stages">
        <div class="stage" data-stage="split">
          <div class="stage-dot"><span>1</span></div>
          <div class="stage-body"><div class="stage-name" data-i18n="st_split"></div><div class="stage-sub" id="st-split-sub"></div></div>
        </div>
        <div class="stage-line"></div>
        <div class="stage" data-stage="translate">
          <div class="stage-dot"><span>2</span></div>
          <div class="stage-body"><div class="stage-name" data-i18n="st_translate"></div><div class="stage-sub" id="st-translate-sub"></div></div>
        </div>
        <div class="stage-line"></div>
        <div class="stage" data-stage="merge">
          <div class="stage-dot"><span>3</span></div>
          <div class="stage-body"><div class="stage-name" data-i18n="st_merge"></div><div class="stage-sub" id="st-merge-sub"></div></div>
        </div>
      </div>
      <div class="progress"><div class="progress-bar" id="pipe-progress"></div></div>
    </section>

    <!-- ===== SPLIT ===== -->
    <section class="page" id="page-split">
      <header class="page-head">
        <span class="step-badge">1</span>
        <h1 data-i18n="split_title"></h1>
        <p data-i18n="split_desc"></p>
      </header>
      <div class="card">
        <div class="io-row"><span class="io-l" data-i18n="io_out"></span><code class="io-path" id="split-out" dir="ltr">–</code></div>
        <div class="field-inline">
          <label for="chunk-split" data-i18n="chunk"></label>
          <div class="stepper">
            <button data-step="-50">−</button>
            <input type="number" id="chunk-split" value="150" min="1" step="50" dir="ltr">
            <button data-step="50">+</button>
          </div>
        </div>
        <div class="actions"><button class="btn primary" id="run-split" data-i18n="run_split"></button></div>
      </div>
    </section>

    <!-- ===== TRANSLATE ===== -->
    <section class="page" id="page-translate">
      <header class="page-head">
        <span class="step-badge">2</span>
        <h1 data-i18n="trans_title"></h1>
        <p data-i18n="trans_desc"></p>
      </header>
      <div class="card">
        <div class="io-row"><span class="io-l" data-i18n="io_in"></span><code class="io-path" id="trans-in" dir="ltr">–</code><span class="pill" id="trans-in-count"></span></div>
        <div class="io-row"><span class="io-l" data-i18n="io_out"></span><code class="io-path" id="trans-out" dir="ltr">–</code></div>
        <div class="actions"><button class="btn danger cancel-btn" data-i18n="cancel"></button><button class="btn primary" id="run-translate" data-i18n="run_translate"></button></div>
        <div class="progress"><div class="progress-bar" id="trans-progress"></div></div>
        <div class="muted" id="trans-status"></div>
      </div>
    </section>

    <!-- ===== MERGE ===== -->
    <section class="page" id="page-merge">
      <header class="page-head">
        <span class="step-badge">3</span>
        <h1 data-i18n="merge_title"></h1>
        <p data-i18n="merge_desc"></p>
      </header>
      <div class="card">
        <div class="io-row"><span class="io-l" data-i18n="io_in"></span><code class="io-path" id="merge-in" dir="ltr">–</code><span class="pill" id="merge-in-count"></span></div>
        <div class="io-row"><span class="io-l" data-i18n="io_out"></span><code class="io-path" id="merge-out" dir="ltr">–</code></div>
        <div class="actions"><button class="btn primary" id="run-merge" data-i18n="run_merge"></button></div>
      </div>
    </section>

    <!-- ===== SETTINGS ===== -->
    <section class="page" id="page-settings">
      <header class="page-head">
        <h1 data-i18n="set_title"></h1>
      </header>

      <div class="card">
        <h2 data-i18n="set_key_title"></h2>
        <p class="muted" data-i18n="set_key_desc"></p>
        <div class="key-status" id="key-status"></div>
        <div class="field-row">
          <input type="password" id="api-key" dir="ltr" autocomplete="off" spellcheck="false">
          <button class="btn primary" id="save-key" data-i18n="save"></button>
        </div>
        <a href="#" class="link" id="get-key-link" data-i18n="get_key"></a>
      </div>

      <div class="card">
        <h2 data-i18n="set_lang_title"></h2>
        <div class="grid2">
          <label class="field"><span data-i18n="source_lang"></span><select id="source-lang"></select></label>
          <label class="field"><span data-i18n="target_lang"></span><select id="target-lang"></select></label>
        </div>
        <div class="toggle-row sub">
          <div>
            <h3 data-i18n="units_title"></h3>
            <p class="muted" data-i18n="units_desc"></p>
          </div>
          <label class="switch">
            <input type="checkbox" id="units-toggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="card">
        <h2 data-i18n="set_output_title"></h2>
        <div class="choice" id="naming-choice">
          <button data-naming="lang"><span class="choice-t" id="naming-lang-example" dir="ltr"></span><span class="choice-d" data-i18n="naming_lang_d"></span></button>
          <button data-naming="suffix"><span class="choice-t" id="naming-suffix-example" dir="ltr"></span><span class="choice-d" data-i18n="naming_suffix_d"></span></button>
        </div>
        <div class="toggle-row sub">
          <div>
            <h3 data-i18n="bom_title"></h3>
            <p class="muted" data-i18n="bom_desc"></p>
          </div>
          <label class="switch">
            <input type="checkbox" id="bom-toggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="card">
        <h2 data-i18n="set_model_title"></h2>
        <p class="muted" data-i18n="set_model_desc"></p>
        <div class="choice" id="model-choice"></div>
      </div>

      <div class="card">
        <div class="toggle-row">
          <div>
            <h2><span data-i18n="set_flex_title"></span> <span class="badge" data-i18n="flex_badge"></span></h2>
            <p class="muted" data-i18n="set_flex_desc"></p>
          </div>
          <label class="switch">
            <input type="checkbox" id="flex-toggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="card">
        <h2 data-i18n="set_think_title"></h2>
        <p class="muted" data-i18n="set_think_desc"></p>
        <div class="choice" id="thinking-choice">
          <button data-level="low"><span class="choice-t" data-i18n="think_low"></span><span class="choice-d" data-i18n="think_low_d"></span></button>
          <button data-level="medium"><span class="choice-t" data-i18n="think_medium"></span><span class="choice-d" data-i18n="think_medium_d"></span></button>
          <button data-level="high"><span class="choice-t" data-i18n="think_high"></span><span class="choice-d" data-i18n="think_high_d"></span></button>
        </div>
      </div>

      <div class="card">
        <div class="toggle-row">
          <div>
            <h2 data-i18n="set_glossary_title"></h2>
            <p class="muted" data-i18n="set_glossary_desc"></p>
          </div>
          <label class="switch">
            <input type="checkbox" id="glossary-toggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="card">
        <h2 data-i18n="set_instr_title"></h2>
        <p class="muted" data-i18n="set_instr_desc"></p>
        <textarea id="instructions" rows="5" dir="auto" spellcheck="false"></textarea>
        <div class="actions"><button class="btn primary" id="save-instructions" data-i18n="save"></button></div>
      </div>

      <div class="card">
        <div class="toggle-row">
          <div>
            <h2 data-i18n="set_workers_title"></h2>
            <p class="muted" data-i18n="set_workers_desc"></p>
          </div>
          <div class="stepper" id="workers-stepper">
            <button data-step="-1">−</button>
            <input type="number" id="workers" value="3" min="1" max="8" dir="ltr">
            <button data-step="1">+</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 data-i18n="set_dirs_title"></h2>
        <p class="muted" data-i18n="set_dirs_desc"></p>
        <div class="grid3">
          <label class="field"><span data-i18n="set_split"></span><input id="set-split" dir="ltr"></label>
          <label class="field"><span data-i18n="set_merge"></span><input id="set-merge" dir="ltr"></label>
          <label class="field"><span data-i18n="set_out"></span><input id="set-output" dir="ltr"></label>
        </div>
        <div class="actions"><button class="btn primary" id="save-dirs" data-i18n="save"></button></div>
      </div>
    </section>

    <!-- ===== HELP ===== -->
    <section class="page" id="page-help">
      <header class="page-head">
        <h1 data-i18n="help_title"></h1>
        <p data-i18n="help_desc"></p>
      </header>
      <div class="help-steps" id="help-steps"></div>
    </section>

    <!-- Result -->
    <div class="result hidden" id="result">
      <div class="result-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <div class="result-text">
        <div class="result-title" data-i18n="result_title"></div>
        <div class="result-path" id="result-path" dir="ltr"></div>
      </div>
      <button class="btn ghost sm" id="open-file" data-i18n="open_file"></button>
      <button class="btn ghost sm" id="open-folder" data-i18n="open_folder"></button>
    </div>

    <!-- Quality check -->
    <div class="qa hidden" id="qa">
      <div class="qa-head">
        <div class="qa-title" id="qa-title"></div>
        <div class="qa-chips" id="qa-chips"></div>
        <button class="btn primary sm" id="run-fix"></button>
      </div>
      <details class="qa-details">
        <summary data-i18n="qa_show"></summary>
        <div class="qa-list" id="qa-list"></div>
      </details>
    </div>

    <!-- Log -->
    <section class="log-wrap" id="log-wrap">
      <div class="log-head">
        <span data-i18n="log_title"></span>
        <span class="usage-chip hidden" id="usage-chip" dir="ltr"></span>
        <button class="link-btn" id="clear-log" data-i18n="clear"></button>
      </div>
      <div class="log" id="log" dir="ltr"><div class="log-empty" data-i18n="log_empty" dir="auto"></div></div>
    </section>
  </main>
</div>

<div class="drag-overlay" id="drag-overlay"><div data-i18n="drop_here"></div></div>
<div class="toasts" id="toasts"></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
